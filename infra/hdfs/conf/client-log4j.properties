# 客户端日志配置（`hdfs dfs` 这类命令用，不走守护进程那份 log4j.properties）
#
# 为什么要单独一份：客户端默认的 console pattern 是 `24/11/22 16:20:00 WARN
# hdfs.DataStreamer: ...`（两位年份、无毫秒、无行号），`hdfs_log4j` 档位解析不了，
# 采下来会整批落到 parse_status=failed。这里照抄守护进程那份 pattern，
# 让**同一套解析器**既能吃服务端日志，也能吃客户端日志。
#
# 这份配置只在 workload 里用（`HADOOP_CLIENT_OPTS=-Dlog4j.configuration=...`），
# 不影响 DataNode/NameNode。
hadoop.root.logger=INFO, console
log4j.rootLogger=INFO, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p %c{1}:%L - %m%n
