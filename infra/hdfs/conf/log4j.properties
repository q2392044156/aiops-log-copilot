# Hadoop 的 log4j 配置（挂进 /opt/hadoop/etc/hadoop/log4j.properties）。
#
# 镜像自带的那份是「只往 stdout 打」：
#   log4j.rootLogger: INFO, stdout
#   ...ConversionPattern: %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
# 这正是旧实验台数据的来源（所以旧日志没有毫秒、审计行混在主日志里）。新环境要的是
# 「能按文件采」，因此改成三条独立出口：
#   主日志   → ${hadoop.log.file}（由 HADOOP_LOG_FILE 指定，每台机器一个名字）
#   审计日志 → hdfs-audit.log（只有 NameNode 会写）
#   stdout   → 关掉；容器 stdout 里只留启动脚本自己的那几行
#
# 时间格式用 %d{ISO8601}，带逗号毫秒 —— 与 P-A §6.2 的 hdfs_log4j 解析档位一致。

log4j.rootLogger=INFO, RFA

# ---------- 主日志 ----------
log4j.appender.RFA=org.apache.log4j.RollingFileAppender
log4j.appender.RFA.File=${hadoop.log.dir}/${hadoop.log.file}
# 轮转留着，但不指望它：采集端按 (inode, offset) 续采，轮转会被 checkpoint 的 inode 变化挡下
log4j.appender.RFA.MaxFileSize=64MB
log4j.appender.RFA.MaxBackupIndex=3
log4j.appender.RFA.layout=org.apache.log4j.PatternLayout
log4j.appender.RFA.layout.ConversionPattern=%d{ISO8601} %-5p %c{1}:%L - %m%n

# ---------- 审计日志 ----------
# 只写审计文件、不进主日志：additivity=false 是关键，否则同一行在两条流里各出现一次，
# 采集端按流各记一条，counters 会和现场对不上。
log4j.logger.org.apache.hadoop.hdfs.server.namenode.FSNamesystem.audit=INFO, RFAAUDIT
log4j.additivity.org.apache.hadoop.hdfs.server.namenode.FSNamesystem.audit=false
log4j.appender.RFAAUDIT=org.apache.log4j.RollingFileAppender
log4j.appender.RFAAUDIT.File=${hadoop.log.dir}/hdfs-audit.log
log4j.appender.RFAAUDIT.MaxFileSize=64MB
log4j.appender.RFAAUDIT.MaxBackupIndex=3
log4j.appender.RFAAUDIT.layout=org.apache.log4j.PatternLayout
log4j.appender.RFAAUDIT.layout.ConversionPattern=%d{ISO8601} %-5p %c{1}:%L - %m%n

# 安全日志（HDFS 的授权/认证）同样单独成流，别混进主日志
log4j.logger.SecurityLogger=INFO, RFASEC
log4j.additivity.SecurityLogger=false
log4j.appender.RFASEC=org.apache.log4j.RollingFileAppender
log4j.appender.RFASEC.File=${hadoop.log.dir}/hdfs-security.log
log4j.appender.RFASEC.layout=org.apache.log4j.PatternLayout
log4j.appender.RFASEC.layout.ConversionPattern=%d{ISO8601} %-5p %c{1}:%L - %m%n
